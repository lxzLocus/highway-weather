name: Build and push Docker image

# kakeibo と同じ運用: イメージをビルドし GHCR (ghcr.io) に push する。
#   - main への push / v* タグ / 手動実行 で push
#   - PR ではビルド検証のみ（push しない）
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 例: lxzLocus/highway-weather -> ghcr.io/lxzlocus/highway-weather
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # index.html 内の JavaScript を構文チェック（壊れた JS をデプロイしない）
      - name: Validate inline JavaScript
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) throw new Error('no inline script found');
            new Function(blocks[blocks.length - 1][1]);
            console.log('inline JS syntax OK');
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PR ではレジストリにログインしない（push しないため）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action は GitHub API の不調でビルドが落ちることがあるため使わず、
      # タグ/ラベルを決定論的に組み立てる（kakeibo の workflow と同方式）。
      - name: Extract metadata (tags, labels)
        id: meta
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          image="$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          tags=("${image}:sha-${GITHUB_SHA::7}")

          case "$GITHUB_REF" in
            refs/heads/*)
              branch="${GITHUB_REF#refs/heads/}"
              tags+=("${image}:${branch//\//-}")
              if [ "$branch" = "$DEFAULT_BRANCH" ]; then tags+=("${image}:latest"); fi
              ;;
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              tags+=("${image}:${version}")
              tags+=("${image}:$(printf '%s' "$version" | cut -d. -f1,2)")
              ;;
            refs/pull/*)
              pr="${GITHUB_REF#refs/pull/}"
              tags+=("${image}:pr-${pr%%/*}")
              ;;
          esac

          {
            echo 'tags<<__META_EOF__'
            printf '%s\n' "${tags[@]}"
            echo '__META_EOF__'
            echo 'labels<<__META_EOF__'
            echo "org.opencontainers.image.title=${GITHUB_REPOSITORY#*/}"
            echo "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '__META_EOF__'
          } >> "$GITHUB_OUTPUT"

          printf 'resolved tags:\n'; printf '  %s\n' "${tags[@]}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
